plugins {
    id 'net.fabricmc.fabric-loom' version '1.15.5' apply false
    id 'net.neoforged.moddev' version '2.0.141' apply false
    id 'com.matyrobbrt.mc.registrationutils' version "${reg_version}"
}

registrationUtils {
    group "tnpl.fractureddimensions.registration"
    projects {
        Common { type 'common'; project ':common' }
        Fabric { type 'fabric'; project ':fabric' }
        Forge { type 'neoforge'; project ':neoforge' }
    }
}